<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modul Ajar Pecahan Interaktif · Kelas 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#14284b;--blue:#1d5bd8;--blue2:#e8f0ff;--ink:#1c2533;--muted:#5f6b7a;--line:#e2e7ef;--bg:#f5f7fb;--soft:#f3f6fb;--yel:#ffcc00;--sh:#4aa3e8;--ok:#15803d;--bad:#b91c1c;
--buka:#64748b;--cct:#c2410c;--cam1:#1d4ed8;--konf:#15803d;--cam2:#7e22ce;--cam3:#0f766e}
*{box-sizing:border-box}
html{scroll-padding-top:130px}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
/* ---------- top bar ---------- */
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:25}
.tin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:0 18px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy);text-decoration:none;white-space:nowrap;font-size:16px}
.logo i{font-style:normal;width:34px;height:34px;border-radius:10px;background:var(--navy);color:var(--yel);display:grid;place-items:center;font-size:16px}
.tnav{display:flex;gap:2px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
.tnav::-webkit-scrollbar{display:none}
.tnav a{color:var(--muted);text-decoration:none;font-weight:700;font-size:14px;padding:8px 12px;border-radius:8px;white-space:nowrap}
.tnav a:hover{background:var(--soft);color:var(--ink)}
.tnav a.on{background:var(--blue2);color:var(--blue)}
@media(max-width:640px){.logo span{display:none}}
main{min-height:60vh}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px}
.sub{color:var(--muted);font-size:14px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.note{font-size:13px;background:#f1f5f9;border-radius:10px;padding:9px 12px;margin-top:8px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{filter:brightness(1.06)}
button.alt{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 1.5px #c9d6ee}
button.sm{padding:6px 11px;font-size:13px}
button:disabled{opacity:.4;cursor:default;filter:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* ---------- hero ---------- */
.hero{background:var(--navy);color:#fff;padding:32px 0 30px}
.hero.sm{padding:22px 0 24px}
.hero h1{font-size:32px;line-height:1.2;margin:6px 0 10px;font-weight:800}
.hero.sm h1{font-size:28px;margin-bottom:8px}
.hero p{max-width:740px;color:#dbe6ff;margin:0 0 18px;font-size:15.5px}
.crumb{font-size:13px;color:#b9cdf5;font-weight:600}.crumb a{color:#fff;text-decoration:none}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.meta span{font-size:14px;color:#c8d5ee}.meta span+span::before{content:'·';margin-right:8px;color:#7f93b8}
/* ---------- beranda ---------- */
.h2{font-size:20px;font-weight:800;color:var(--navy);margin:30px 0 12px}
.kick{font-size:13px;font-weight:600;color:var(--muted)}
@media(max-width:780px){.hero h1{font-size:26px}}
/* ---------- halaman pertemuan ---------- */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);gap:26px;padding-top:22px;padding-bottom:140px;align-items:start}
.side{position:sticky;top:76px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;max-height:calc(100vh - 92px);overflow:auto}
.sg h6{margin:12px 10px 4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.sg h6 i{width:8px;height:8px;border-radius:50%}
.si{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink);position:relative;margin-bottom:2px}
.si:hover{background:var(--soft)}
.si .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;border:2px solid var(--c);color:var(--c);background:#fff}
.si.on .ic{background:var(--c);color:#fff}
.si .tx{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.si .tx b{font-size:14px}.si .tx small{font-size:12px;color:var(--muted)}
.si.on{background:var(--blue2)}.si.on b{color:var(--blue)}
.si.on::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--blue)}
@media(max-width:980px){
 .shell{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:0}
 .side{top:60px;z-index:15;max-height:none;display:flex;gap:6px;overflow-x:auto;padding:8px 18px;border-radius:0;margin:0 -18px;border-width:0 0 1px;scrollbar-width:none}
 .side::-webkit-scrollbar{display:none}
 .sg{display:contents}.sg h6{display:none}
 .si{flex:none;margin:0;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:99px}
 .si .ic{width:24px;height:24px;font-size:12px}
 .si .tx small{display:none}.si .tx b{font-size:13px;white-space:nowrap}
 .si.on{border-color:var(--blue)}.si.on::before{display:none}
 html{scroll-padding-top:120px}}
.panel[hidden]{display:none}
.ph{display:flex;gap:14px;align-items:flex-start;margin:6px 0 14px}
.ph .bnum{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:800;color:#fff;flex:none;margin-top:2px}
.ph h2{margin:0 0 2px;font-size:24px;color:var(--navy);line-height:1.25;font-weight:800}
.guide{background:#fffdf3;border:1px solid #efe3b5;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.guide p{margin:0}
.guide .gt{display:block;font-size:13px;font-weight:700;color:#8a6d00;margin-bottom:2px}
.guide ol{margin:0;padding-left:20px;font-size:14px}.guide li{margin:3px 0}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px;border-top:1px solid var(--line);padding-top:16px}
.pager a{flex:1;max-width:49%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;color:var(--ink)}
.pager a:hover{border-color:var(--blue)}
.pager a small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.pager a b{color:var(--blue);font-size:15px}
.pager a.nx{text-align:right;margin-left:auto}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{background:transparent;color:var(--muted);box-shadow:none;padding:8px 14px}
.seg button.on{background:var(--navy);color:#fff}
.modehint{margin:8px 0 12px}
/* frac */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:700;margin:0 2px}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.sh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--soft);cursor:pointer;flex-wrap:wrap}
.no{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.st{font-weight:700}
.min{margin-left:auto;font-weight:700;font-size:13px;border:1.5px solid var(--navy);color:var(--navy);border-radius:99px;padding:1px 10px;background:#fff}
.col{padding:10px 14px;font-size:14px}
.col+.col{border-left:1px dashed var(--line)}
.col h4{margin:0 0 4px;font-size:11px;letter-spacing:.8px;color:var(--muted)}
.col ul{margin:0;padding-left:18px}
.q{background:#f1f5f9;border-radius:8px;padding:7px 10px;font-style:italic;margin-bottom:6px}
.lock{color:var(--bad);background:#fee2e2}
.media{color:var(--navy);background:#dbeafe;text-decoration:none}
.rumus{background:var(--yel);border-radius:12px;padding:12px 16px;font-weight:600;text-align:center;margin-top:8px}
@media(max-width:720px){.col+.col{border-left:0;border-top:1px dashed var(--line)}}
details{margin-top:6px;font-size:12.5px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--navy)}
.cards{display:grid;gap:10px}
.card{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.card .lab{font-size:22px;margin-top:6px}
.card svg{max-width:100%;height:auto}
.tebak{display:grid;grid-template-columns:1fr;gap:12px;justify-items:center}
.tebak .card{width:min(420px,100%);padding:18px}
.tebak .card .lab{font-size:30px}
.verdict{font-weight:700;font-size:16px;min-height:1.5em;text-align:center}
/* lkpd */
.item{border-top:1px dashed var(--line);padding:12px 0}
.item:first-child{border-top:0}
.fin{width:46px;font:inherit;font-weight:700;text-align:center;padding:3px;border:2px solid var(--line);border-radius:8px}
.fin.ok,.sel.ok{border-color:var(--ok);background:#dcfce7}.fin.bad,.sel.bad{border-color:var(--bad);background:#fee2e2}
.sel{font:inherit;font-weight:700;padding:3px 6px;border:2px solid var(--line);border-radius:8px}
.fstack{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.fstack hr{width:52px;border:0;border-top:2px solid var(--ink);margin:0}
.pairfig{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chipf{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:18px;cursor:pointer;color:var(--ink)}
.chipf.used{opacity:.3}
.chipf.pick{border-color:var(--navy);background:#dbeafe}
.slot{min-width:56px;min-height:48px;border:2px dashed var(--line);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.res{font-weight:700;margin-left:6px}
.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
svg .tap{cursor:pointer}
/* home */
.big{font-size:20px}
input[type=range]{width:100%;accent-color:var(--navy)}
.pairs{display:flex;flex-wrap:wrap;gap:18px 34px;justify-content:center}
.pair{display:flex;gap:10px}
.kc{width:150px;height:188px;background:#5f86a2;border-radius:14px;padding:9px;display:flex;flex-direction:column;gap:7px;flex:none}
.kc.big{width:250px;height:312px;border-radius:20px;padding:13px;gap:10px}
.kin{flex:1;background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:7px;overflow:hidden}
.klab{height:32px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#111;flex:none}
.kc.big .klab{height:48px;font-size:21px}
.kbar1 svg,.kbars svg{display:block;width:115px;height:auto}.kc.big .kbar1 svg,.kc.big .kbars svg{width:195px}
.kbars{display:flex;flex-direction:column;gap:5px}
.kshape svg{display:block;height:80px;width:auto}.kc.big .kshape svg{height:135px}
.kfr{font-size:22px;font-weight:700;color:#111;line-height:1.1}.kc.big .kfr{font-size:34px}
.kfr.sm{font-size:18px}.kc.big .kfr.sm{font-size:26px}
.ktxt{font-size:12px;line-height:1.45;color:#111}.kc.big .ktxt{font-size:17px}
@media(max-width:380px){.pair{gap:6px}.kc{width:138px;height:174px}}
.mjb{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 6px;min-height:240px;justify-content:center}
.mjq{font-size:21px;font-weight:600;text-align:center;max-width:640px}
.mjf{display:flex;justify-content:center}
.mjf svg{max-width:100%;height:auto}
.mjo.pick{border-color:var(--navy);background:#dbeafe}
.dg{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-top:8px}
.dp{border:3px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center}
.dp:first-child{border-color:#2563eb}.dp:last-child{border-color:#dc2626}
.dp.out{opacity:.45}
.dn{font:inherit;font-weight:700;font-size:18px;text-align:center;border:0;border-bottom:2px dashed var(--line);background:transparent}
.ds{font-size:46px;font-weight:700;line-height:1}
.db{font-size:19px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.db small{font-size:11px;font-weight:500;opacity:.8}
.db.dok{background:#15803d}.db.dno{background:#b91c1c}
@media(max-width:760px){.dg{grid-template-columns:1fr 1fr}.dc{grid-column:1/3;grid-row:1;justify-self:center}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:10px}
.pq{border:2px solid #f2b8b5;border-radius:12px;padding:8px;text-align:center}
.pno{text-align:left;font-weight:700;color:var(--navy)}
.pk{position:relative;height:150px;width:200px;margin:0 auto}
.parc{position:absolute;top:0;right:0;bottom:0;left:0;width:200px;height:150px}
.pop{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;font-weight:700;color:#5b6478;font-size:15px}
.pop.top{top:0}.pop.bot{bottom:0}
.pin{width:40px !important;height:32px;font-size:17px}
.pv{display:inline-block;min-width:34px;border:2px solid #7aa2c8;border-radius:6px;padding:1px 4px;background:#fff;color:var(--ink)}
.pf{position:absolute;top:50%;transform:translateY(-50%);font-size:24px}
.pf.l{left:28px}.pf.r{right:22px}
.peq{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:700}
.pbar{display:flex;flex-direction:column;gap:3px;align-items:center;margin-top:4px}
.pbar svg{width:180px;height:auto}
.dlg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.dlp{border:3px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.dlp.kr{border-color:#2563eb}.dlp.kn{border-color:#dc2626}
.dlp.menang{background:#dcfce7}
.dq{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:200px;justify-content:center}
.dqq{font-size:18px;font-weight:600;text-align:center}
.dsg{min-width:46px;border:2px dashed var(--line);border-radius:10px;text-align:center}
.dopt.pick{border-color:var(--navy);background:#dbeafe}
.djb{font-size:18px;padding:12px}
.dres{text-align:center;font-weight:700;min-height:1.4em}
.goyang{animation:gy .35s}
@keyframes gy{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(max-width:700px){.dlg{grid-template-columns:1fr}}
.sh{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;cursor:pointer;flex-wrap:wrap}
.sh:hover{background:var(--soft)}
.no{width:32px;height:32px}
.st{font-weight:800;font-size:15.5px}
.min{border:1px solid var(--line);color:var(--ink);background:#fff}
.sh [data-play]{width:34px;height:34px;padding:0;border-radius:50%}
.col h4{font-size:11px;letter-spacing:.8px}
.dg{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.dn{width:100%;min-width:0}
@media(max-width:600px){.dg{grid-template-columns:1fr 1fr}.dc{grid-column:1/3;grid-row:1;justify-self:center}}
/* ---------- gaya sederhana (putih, satu warna aksen) ---------- */
:root{color-scheme:light;--blue:#1d4ed8;--blue2:#eff4ff;--bg:#fff;--line:#d9dbe3;--ink:#21242c;--muted:#5d6170;--navy:#21242c}
html,body{background:#fff}
input,select,textarea{color-scheme:light;background-color:#fff;color:var(--ink)}
.fin,.sel{background-color:#fff;color:var(--ink);border-color:#c5c8d3;-webkit-appearance:none;appearance:none}
.sel{padding-right:8px;text-align:center}
.fin:focus,.sel:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.fin.ok,.sel.ok{background-color:#dcfce7;border-color:var(--ok)}.fin.bad,.sel.bad{background-color:#fee2e2;border-color:var(--bad)}
.dn{background:transparent;color:var(--ink)}
.box{border-color:var(--line);border-radius:10px}
.hero{background:#fff;color:var(--ink);padding:52px 0 34px;border-bottom:1px solid #ecedf1}
.hero.sm{padding:30px 0 24px}
.hero h1{font-size:46px;line-height:1.1;letter-spacing:-.8px;max-width:760px;margin:10px 0 16px}
.hero.sm h1{font-size:34px;letter-spacing:-.4px;margin:6px 0 8px}
.hero p{color:#3a3e4a;font-size:17.5px;max-width:700px}
.crumb{color:var(--muted)}.crumb a{color:var(--blue);text-decoration:none}
.meta span{color:var(--muted)}.meta span+span::before{color:#b6b9c4}
button.alt{box-shadow:inset 0 0 0 1.5px #c5c8d3}
.narrow{max-width:900px}
.info{display:flex;gap:12px;align-items:flex-start;background:var(--blue2);color:#2b2a7a;border-radius:10px;padding:14px 18px;margin-top:28px;font-size:15px}
.h2{color:var(--ink);font-size:22px;margin:34px 0 14px}
.list{display:flex;flex-direction:column;gap:16px}
.chev{flex:none;color:var(--blue)}
.side{border-color:var(--line);border-radius:10px}
.si .ic{border-color:#c5c8d3;color:var(--muted)}
.si.on .ic{background:var(--blue);border-color:var(--blue);color:#fff}
.ph .bnum{background:var(--ink)}
.guide{background:var(--blue2);border:0;color:#2b2a7a}
.guide .gt{color:#2b2a7a}.pager a{border-radius:10px}
.seg button.on{background:var(--ink)}
@media(max-width:780px){.hero h1{font-size:34px}.hero.sm h1{font-size:28px}}

/* maskot & sentuhan ceria */
.logo i{background:transparent;width:34px;height:34px}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:24px;align-items:center}
.hgrid.sm{grid-template-columns:minmax(0,1fr) 130px}
.hart .mascot{width:100%;height:auto;display:block}
.hero{background:linear-gradient(180deg,#fff 0%,#fff 70%,#f1f5f9 100%)}
.hart .mascot{animation:ngambang 4s ease-in-out infinite}
@keyframes ngambang{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.hart .mascot{animation:none}}
@media(max-width:700px){.hgrid{grid-template-columns:minmax(0,1fr) 120px}.hgrid.sm{grid-template-columns:1fr}.hgrid.sm .hart{display:none}}
/* ---------- animasi ---------- */
.anim{padding:18px}
.an-head,.gm-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.an-head h3,.gm-head h3{margin:0;font-size:20px;color:var(--ink)}
.an-stage{background:#fafaff;border:1px solid #ecedf5;border-radius:12px;padding:10px}
.an-svg{width:100%;height:auto;display:block;max-height:420px}
.an-cap{display:flex;gap:12px;align-items:flex-start;min-height:62px;margin:14px 2px 8px;font-size:19px;line-height:1.45}
.an-no{flex:none;background:var(--ink);color:#fff;border-radius:99px;font-size:13px;font-weight:800;padding:3px 10px;margin-top:3px}
.an-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid #ecedf1;padding-top:12px}
.an-dots{display:flex;gap:6px}
.an-dots button{width:12px;height:12px;padding:0;border-radius:50%;background:#dcdde6;box-shadow:none}
.an-dots button.done{background:#a5a6f6}.an-dots button.on{background:var(--blue);transform:scale(1.25)}
.an-ctl{display:flex;gap:8px;flex-wrap:wrap}
.an-play{min-width:120px}
/* ---------- tantangan ---------- */
.gm{padding:18px;margin-top:16px;border:2px solid #e6e6ff}
.gm-pr{display:flex;gap:5px;align-items:center}
.gm-pr i{width:22px;height:8px;border-radius:99px;background:#e3e4ec}.gm-pr i.d{background:#a5a6f6}.gm-pr i.c{background:var(--blue)}
.gm-pr span{margin-left:8px;font-weight:800;font-size:14px}
.gm-q{font-size:19px;margin:6px 0 14px}
.gm-inl{font-weight:800;background:#eff4ff;border-radius:8px;padding:1px 8px}
.gm-body{display:flex;flex-direction:column;align-items:center;gap:16px}
.gm-fig{display:flex;flex-direction:column;align-items:center;gap:8px}
.gm-fig.g-pop{animation:gpop .35s ease}

/* ================= GAYA SHADCN (zinc) — warna anak, kue NTT, tenun tetap ================= */
:root{--background:#fff;--foreground:#09090b;--muted-bg:#f4f4f5;--muted-fg:#71717a;--border:#e4e4e7;--input:#e4e4e7;--primary:#1d4ed8;--primary-fg:#fff;--ring:#a1a1aa;--radius:.625rem;
 --ink:#09090b;--muted:#71717a;--line:#e4e4e7;--soft:#f4f4f5;--navy:#09090b;--blue:#1d4ed8;--blue2:#eef2ff}
body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif;font-feature-settings:"cv11","ss01";letter-spacing:-.006em;color:var(--foreground)}
::selection{background:#dbe6ff}
/* --- bilah atas --- */
.topbar{border-bottom:1px solid var(--border);background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(8px)}
.tin{height:56px}
.logo{font-size:15px;font-weight:600;letter-spacing:-.01em}
.tnav a{font-weight:500;font-size:14px;color:var(--muted-fg);padding:6px 12px;border-radius:calc(var(--radius) - 2px)}
.tnav a:hover{background:var(--muted-bg);color:var(--foreground)}
.tnav a.on{background:var(--muted-bg);color:var(--foreground)}
/* --- tombol --- */
button{font-weight:500;font-size:14px;border-radius:calc(var(--radius) - 2px);padding:8px 16px;background:var(--primary);color:var(--primary-fg);box-shadow:0 1px 2px rgba(0,0,0,.05);transition:background .15s,box-shadow .15s,color .15s}
button:hover{filter:none;background:#1e40af}
button.alt{background:#fff;color:var(--foreground);box-shadow:inset 0 0 0 1px var(--input),0 1px 2px rgba(0,0,0,.04)}
button.alt:hover{background:var(--muted-bg)}
button.sm{padding:6px 12px;font-size:13px}
button:focus-visible,a:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
/* --- kartu & kotak --- */
.box{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.hero{border-bottom:1px solid var(--border);background:#fff}
.hero h1{font-weight:700;letter-spacing:-.035em}
.hero.sm h1{letter-spacing:-.03em}
.hero p{color:var(--muted-fg)}
.crumb{color:var(--muted-fg);font-weight:500}.crumb a{color:var(--foreground)}
.kick{font-size:12.5px;font-weight:500;color:var(--muted-fg)}
.h2{font-weight:600;letter-spacing:-.02em;font-size:20px}
.sub{color:var(--muted-fg)}
/* --- beranda --- */
.info{background:var(--muted-bg);color:var(--foreground);border:1px solid var(--border);border-radius:calc(var(--radius) + 2px);font-size:14px}
.info a{color:var(--foreground);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.list{gap:12px}
.chev{color:var(--muted-fg)}
/* --- halaman pertemuan --- */
.side{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);box-shadow:0 1px 2px rgba(0,0,0,.04);padding:8px}
.sg h6{font-size:12px;font-weight:500;color:var(--muted-fg);margin:10px 10px 4px}
.si{border-radius:calc(var(--radius) - 2px);padding:7px 10px}
.si:hover{background:var(--muted-bg)}
.si.on{background:var(--muted-bg)}.si.on b{color:var(--foreground)}
.si.on::before{display:none}
.si .tx b{font-weight:500}
.ph h2{font-weight:600;letter-spacing:-.025em;color:var(--foreground)}
.ph .bnum{background:var(--primary);font-weight:600;font-size:15px;width:34px;height:34px}
.guide{background:var(--muted-bg);border:1px solid var(--border);color:var(--foreground);border-radius:calc(var(--radius) + 2px)}
.guide .gt{color:var(--muted-fg);font-weight:600;font-size:12.5px}
.pager a{border:1px solid var(--border);border-radius:calc(var(--radius) + 2px);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.pager a:hover{background:#fafafa;border-color:#d4d4d8}
.pager a b{color:var(--foreground);font-weight:600}
.seg{background:var(--muted-bg);border:0;border-radius:var(--radius);padding:3px}
.seg button{background:transparent;color:var(--muted-fg);box-shadow:none;font-weight:500;padding:6px 12px}
.seg button:hover{background:transparent;color:var(--foreground)}
.seg button.on{background:#fff;color:var(--foreground);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.fs-go{background:var(--primary)}
.dq-box{border:1px solid var(--border)!important;border-left:4px solid var(--blue)!important;border-radius:calc(var(--radius) + 4px);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.dq-no{background:var(--muted-bg);color:var(--foreground);border-radius:calc(var(--radius) - 4px);font-weight:600;font-size:12.5px}
.ps-card{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ps-card b{font-weight:600}
.ps-btns .ps-open{background:var(--primary);border-radius:calc(var(--radius) - 2px)}
.ps-btns .ps-open.alt{background:#fff;color:var(--foreground);box-shadow:inset 0 0 0 1px var(--input)}
.an-tag{background:var(--muted-bg);color:var(--foreground);border-radius:calc(var(--radius) - 4px);font-weight:600;font-size:12px;border:1px solid var(--border)}
.lk-mode button.on{background:#fff}
/* --- game menu --- */
.tk-lvc{box-shadow:inset 0 0 0 1px var(--border),0 1px 2px rgba(0,0,0,.04);border-radius:calc(var(--radius) + 4px)}
.tk-lvc:hover{box-shadow:inset 0 0 0 1px #d4d4d8,0 1px 2px rgba(0,0,0,.04);background:#fafafa;transform:none}
.tk-lno{border-radius:calc(var(--radius) - 2px);font-weight:600}
.tk-lt b{font-weight:600}
/* --- input --- */
input,select,textarea,.fin,.sel{border-radius:calc(var(--radius) - 2px)!important}
.fin,.sel,.cb-ctl select,.cb-num,.gf-lv select{border:1px solid var(--input)!important;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.fin:focus,.sel:focus{outline:2px solid var(--ring)!important;outline-offset:1px;border-color:var(--ring)!important}
/* --- identitas --- */
.kredit{background:#fafafa;border-top:1px solid var(--border)}
.kr-link{border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);box-shadow:0 1px 2px rgba(0,0,0,.04);font-weight:500}
.kr-link svg{color:var(--muted-fg)}
.kr-in-btn{border-radius:calc(var(--radius) - 2px)}
/* --- panduan pop-up --- */
.t2-tip{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px)}
.t2-no{color:var(--muted-fg);font-weight:500}.t2-t{font-weight:600}
.sec-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:30px 0 14px}.sec-hd .h2{margin:0}
.xgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.xcard{display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);padding:14px 16px;text-decoration:none;color:var(--foreground);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.xcard:hover{border-color:#c7c7d1}
.x-ic{flex:none;width:48px;height:48px;border-radius:var(--radius);display:grid;place-items:center;font-size:24px}.x-ic svg{width:34px;height:auto}
.x-tx{display:flex;flex-direction:column}.x-tx b{font-size:15px;font-weight:600}.x-tx small{font-size:13px;color:var(--muted-fg)}
@media(max-width:640px){.xgrid{grid-template-columns:1fr}}

.pgrid3{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pc3{display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:calc(var(--radius) + 2px);padding:14px 16px;text-decoration:none;color:var(--foreground);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:border-color .15s}
.pc3:hover{border-color:#c7c7d1}
.pc3-no{flex:none;width:38px;height:38px;border-radius:var(--radius);display:grid;place-items:center;font-weight:700;font-size:16px}
.pc3-tx{display:flex;flex-direction:column;min-width:0}.pc3-tx b{font-size:15px;font-weight:600}.pc3-tx small{font-size:13px;color:var(--muted-fg)}
@media(max-width:640px){.pgrid3{grid-template-columns:1fr}}
.pgrid3,.xgrid{gap:12px}.pc3,.xcard{padding:14px 16px;min-height:72px}

/* ================= PALET MASKOT (ungu & kuning), bukan abu-abu/hitam ================= */
:root{--foreground:#1e293b;--ink:#1e293b;--navy:#1e293b;--muted-bg:#f1f5f9;--muted-fg:#475569;--muted:#475569;--border:#e2e8f0;--line:#e2e8f0;--input:#cbd5e1;--ring:#94a3b8;--soft:#f1f5f9;--primary:#1d4ed8;--primary-fg:#fff;--kuning:#ffcc00}
body{color:var(--foreground)}
.topbar{border-bottom-color:var(--border)}
.tnav a{color:var(--muted-fg)}.tnav a:hover{background:var(--muted-bg);color:var(--foreground)}
.tnav a.on{background:#e6eeff;color:#1e40af}
button:hover{background:#1e40af}
button.alt{color:#1e40af;box-shadow:inset 0 0 0 1px var(--input),0 1px 2px rgba(15,23,42,.05)}
button.alt:hover{background:#f1f5f9}
.box,.pc3,.xcard,.side,.ps-card,.pager a,.tk-lvc,.kr-link,.dq-box{border-color:var(--border)!important;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.si.on{background:#e6eeff}.si.on b{color:#1e40af}
.seg{background:#e6eeff}.seg button{color:#475569}.seg button.on{color:#1e40af;box-shadow:0 1px 3px rgba(15,23,42,.12)}
.guide{background:#f1f5f9;border-color:var(--border)}
.guide .gt{color:#1d4ed8}
.info{background:#f1f5f9}
.ph .bnum{background:var(--primary)}
.dq-no,.an-tag{background:#e6eeff;color:#1e40af;border-color:#dcdaf8}
.kredit{background:#f8f8ff;border-top-color:var(--border)}
.kr-link svg{color:#1d4ed8}
.hero{border-bottom-color:var(--border)}
.crumb a{color:#1e40af}
/* --- bagian atas beranda: panel berlatar --- */
.hp{padding:26px 0 4px}
.hp-panel{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:center;border:1px solid var(--border);border-radius:20px;padding:30px 34px;background:linear-gradient(135deg,#f8fafc 0%,#eff4ff 100%);box-shadow:0 1px 2px rgba(15,23,42,.05)}
.hp-badge{display:inline-block;font-size:12.5px;font-weight:600;color:#1e40af;background:#fff;border:1px solid #dcdaf8;border-radius:99px;padding:4px 12px}
.hp h1{font-size:38px;line-height:1.12;letter-spacing:-.035em;font-weight:700;margin:14px 0 12px;color:var(--foreground)}
.hp h1 i{color:inherit}
.hp p{color:var(--muted-fg);font-size:16px;margin:0;max-width:540px}
.hp-art{max-width:250px;justify-self:center;width:100%}.hp-art .mascot{width:100%;height:auto;display:block}
/* --- maskot berputar: badan berputar sekali lalu diam sebentar, bayangan & hiasan tetap --- */
.mascot{overflow:visible}
@keyframes mputar{0%,55%{transform:rotate(0)}85%{transform:rotate(370deg)}92%{transform:rotate(355deg)}100%{transform:rotate(360deg)}}
.hart .mascot{animation:none}
@media(prefers-reduced-motion:reduce){.mascot .m-body{animation:none}}
/* --- pilih pertemuan: tenang, satu warna gelap --- */
.pc3-no{font-weight:700}
.pc3:hover{border-color:#94a3b8!important}

.x-ic{background:#f1f5f9!important}
@media(max-width:700px){.hp-panel{grid-template-columns:1fr;padding:24px 22px}.hp-art{max-width:170px;grid-row:1}.hp h1{font-size:28px}}

.pgrid3.satu{grid-template-columns:1fr;gap:10px}
.pgrid3.satu .pc3{padding:16px 18px}
.pgrid3.satu .pc3-tx{flex:1}.pgrid3.satu .pc3-tx b{font-size:16px}
.pgrid3.satu .pc3 .chev{color:#94a3b8;flex:none}
.pgrid3.satu .pc3:hover .pc3-no{filter:brightness(.97)}

/* ===== menu atas: Pertemuan ▾ ===== */
.tnav{overflow:visible}
.nd{position:relative}
.nd-b{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;background:none;border:0;box-shadow:none;font:inherit;font-weight:500;font-size:14px;color:var(--muted-fg);padding:6px 10px 6px 12px;border-radius:6px;cursor:pointer;min-height:0}
.nd-b:hover{background:var(--muted-bg);color:var(--foreground)}
.nd-b.on{background:#e6eeff;color:#1e40af}
.nd-b[aria-expanded="true"] svg{transform:rotate(180deg)}
.nd-m{position:absolute;top:calc(100% + 6px);left:0;width:180px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.12);padding:6px;z-index:60}
.nd-m[hidden]{display:none}
.nd-m a{display:block;font-size:14px;font-weight:500;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--foreground);background:none}
.nd-m a:hover{background:var(--muted-bg)}
.nd-m a.on{background:#eff4ff;color:#1e40af}
.nd-m a span:last-child{display:flex;flex-direction:column;line-height:1.25}
.nd-m b{font-size:14px;font-weight:600}.nd-m small{font-size:12px;color:var(--muted-fg)}
@media(max-width:640px){.tnav{gap:0}.tnav a,.nd-b{padding:6px 6px;font-size:13.5px}.nd-b{gap:2px}.nd{position:static}.nd-m{position:fixed;top:58px;left:auto;right:12px;width:180px}}

/* nama tim/pemain: buang tanda yang bisa disisipkan sebagai kode, batasi panjang */

/* ================= util gambar pecahan ================= */
const SH='#4aa3e8',ST='#1f2a44';
function F(a,b){return `<span class="fr"><span>${a}</span><span>${b}</span></span>`}
function fx(s){return s.replace(/(\d+)\/(\d+)/g,(m,a,b)=>F(a,b)).replace(/!=/g,'≠')}
// bar: parts = n atau array lebar relatif; s = jumlah diarsir (dari kiri) atau array indeks
function bar(parts,s,o={}){
 const W=o.w||200,H=o.h||30,L=(o.len!=null?o.len:1); const arr=Array.isArray(parts)?parts:Array(parts).fill(1);
 const tot=arr.reduce((a,b)=>a+b,0),sset=Array.isArray(s)?new Set(s):new Set([...Array(s).keys()]);
 let x=2,out='';const wl=(W-4)*L;
 arr.forEach((p,i)=>{const w=p/tot*wl;out+=`<rect ${o.tap?`class="tap" data-i="${i}"`:''} x="${x}" y="2" width="${w}" height="${H-4}" fill="${sset.has(i)?SH:'#fff'}" stroke="${ST}" stroke-width="1.6"/>`;x+=w});
 return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${out}</svg>`;
}
function circ(parts,s,o={}){
 const R=o.r||44,C=R+3;const arr=Array.isArray(parts)?parts:Array(parts).fill(1);
 const tot=arr.reduce((a,b)=>a+b,0),sset=Array.isArray(s)?new Set(s):new Set([...Array(s).keys()]);
 let a0=-Math.PI/2,out='';
 if(arr.length===1)out=`<circle ${o.tap?'class="tap" data-i="0"':''} cx="${C}" cy="${C}" r="${R}" fill="${sset.has(0)?SH:'#fff'}" stroke="${ST}" stroke-width="1.6"/>`;
 else arr.forEach((p,i)=>{const a1=a0+p/tot*2*Math.PI,lg=(a1-a0)>Math.PI?1:0;
  out+=`<path ${o.tap?`class="tap" data-i="${i}"`:''} d="M${C},${C} L${C+R*Math.cos(a0)},${C+R*Math.sin(a0)} A${R},${R} 0 ${lg} 1 ${C+R*Math.cos(a1)},${C+R*Math.sin(a1)} Z" fill="${sset.has(i)?SH:'#fff'}" stroke="${ST}" stroke-width="1.6"/>`;a0=a1});
 return `<svg viewBox="0 0 ${2*C} ${2*C}" width="${2*C}" height="${2*C}">${out}</svg>`;
}
// rects: daftar sel [x,y,w,h] dalam persegi satuan
function rects(cells,s,o={}){
 const S=o.size||84,sset=Array.isArray(s)?new Set(s):new Set([...Array(s).keys()]);
 return `<svg viewBox="0 0 ${S+4} ${S+4}" width="${S+4}" height="${S+4}">${cells.map((c,i)=>`<rect ${o.tap?`class="tap" data-i="${i}"`:''} x="${2+c[0]*S}" y="${2+c[1]*S}" width="${c[2]*S}" height="${c[3]*S}" fill="${sset.has(i)?SH:'#fff'}" stroke="${ST}" stroke-width="1.6"/>`).join('')}</svg>`;
}
function grid(r,c){const out=[];for(let y=0;y<r;y++)for(let x=0;x<c;x++)out.push([x/c,y/r,1/c,1/r]);return out}
function shape(d,o={}){return d.t==='bar'?bar(d.p,d.s,{...o,...d.o}):d.t==='circ'?circ(d.p,d.s,{...o,...d.o}):rects(d.p,d.s,{...o,...d.o})}

{id:'p1',judul:'Konsep Dasar Pecahan',tag:'Pertemuan 1',

  {t:'Menuliskan Dugaan Awal',m:15,f:'cct',g:['Bagikan LKPD Dugaanku','Keliling, petakan jawaban (pakai rekap di bawah)'],s:['Isi Bagian 1 secara individu: jawaban, alasan, yakin/ragu'],q:['Mana yang lebih besar, 1/3 atau 1/5?'],media:'dugaan'},
  {t:'Konsep: Bagian Sama Besar',m:25,f:'cam1',g:['Sajikan Kartu Set 1 (Index Gambar 1)'],s:['Amati, bandingkan, sampaikan perbedaan','Tulis dugaan di LKPD'],q:['Apa persamaan gambar pada kartu contoh?','Mengapa gambar ini termasuk bukan contoh?'],lock:'Tahan konfirmasi',media:'set1'},
  {t:'Konsep: Pembilang',m:25,f:'cam1',g:['Sajikan Kartu Set 2 dan tempel berdampingan dengan Set 1'],s:['Amati, bandingkan, kemukakan dugaan'],q:['Apa yang sama? Apa yang berbeda?','Jumlah bagian yang diarsir sama dengan angka di atas atau di bawah garis?'],lock:'Tahan konfirmasi',media:'set2'},

function animPlayer(el,A){
 const n=A.steps.length;let s=0,k=1,play=false,raf=0,last=0,hold=0;
 el.innerHTML=`<div class="an-head"><div><div class="kick">Animasi penjelasan</div><h3>${A.judul}</h3></div><div class="row"><button class="alt sm an-help" type="button">? Petunjuk</button></div></div>
  <div class="an-stage"><svg viewBox="0 0 ${A.w} ${A.h}" class="an-svg" role="img" aria-label="${A.judul}"></svg></div>
  <div class="an-cap" aria-live="polite"></div>
  <div class="an-bar"><div class="an-dots">${A.steps.map((_,i)=>`<button type="button" data-i="${i}" aria-label="Langkah ${i+1}"></button>`).join('')}</div>
  <div class="an-ctl"><button class="alt" data-a="prev" type="button">◀ Sebelumnya</button><button data-a="play" type="button" class="an-play">▶ Putar</button><button class="alt" data-a="next" type="button">Berikutnya ▶</button><button class="alt" data-a="reset" type="button" title="Ulang dari awal">↺</button></div></div>`;
 const svg=el.querySelector('svg'),cap=el.querySelector('.an-cap'),pb=el.querySelector('.an-play'),dots=[...el.querySelectorAll('.an-dots button')];
 const paint=()=>{svg.innerHTML=A.draw(s,k);cap.innerHTML=`<span class="an-no">${s+1}/${n}</span><span>${A.steps[s].c}</span>`;
  dots.forEach((d,i)=>{d.classList.toggle('on',i===s);d.classList.toggle('done',i<s)});
  pb.innerHTML=play?'❚❚ Jeda':(s===n-1&&k>=1?'↺ Putar lagi':'▶ Putar');
  el.querySelector('[data-a=prev]').disabled=s===0;el.querySelector('[data-a=next]').disabled=s===n-1&&k>=1};
 const stop=()=>{play=false;if(raf)cancelAnimationFrame(raf);raf=0;paint()};
 const tick=t=>{raf=0;if(!el.offsetParent){play=false;paint();return}const dt=Math.min(64,t-last);last=t;
  if(k<1){k=Math.min(1,k+dt/A.steps[s].d);paint()}
  else if(play){hold+=dt;
   if(hold>Math.max(2200,A.steps[s].c.replace(/<[^>]+>/g,'').length*60)){if(s<n-1){s++;k=0;hold=0;paint()}else{play=false;paint()}}}
  if(k<1||play)raf=requestAnimationFrame(tick)};
 const kick=()=>{if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}};
 const go=(ns,anim)=>{s=cl(ns,0,n-1);k=anim?0:1;hold=0;paint();kick()};
 el.querySelector('.an-ctl').onclick=e=>{const _b=e.target.closest('button'),a=_b&&_b.dataset.a;if(!a)return;
  if(a==='play'){if(play){stop();return}if(s===n-1&&k>=1)s=0;play=true;go(s,true)}
  if(a==='next'){play=false;if(k<1){k=1;paint()}else go(s+1,true)}
  if(a==='prev'){play=false;go(s-1,false)}
  if(a==='reset'){play=false;go(0,true)}};
 el.querySelector('.an-dots').onclick=e=>{const i=e.target.dataset.i;if(i!=null){play=false;go(+i,true)}};
 el.querySelector('.an-help').onclick=()=>tourOpen(true);
 s=0;k=1;paint();
}

function tween(ms,fn,done){const t0=performance.now();let id;const f=t=>{const u=cl((t-t0)/ms);fn(u);if(u<1)id=requestAnimationFrame(f);else done&&done()};id=requestAnimationFrame(f);return()=>cancelAnimationFrame(id)}
const optN=(sel,from,to)=>Array.from({length:to-from+1},(_,i)=>`<option${from+i===sel?' selected':''}>${from+i}</option>`).join('');

/* 1. membagi sama besar */
function cobaBagi(el){let n=4,uq=false,w=[1,1,1,1],sh=new Set([0]),fresh=false;
 el.innerHTML=`<div class="cb-ctl"><label class="cb-l">Banyak bagian: <input type="range" min="1" max="12" value="4" class="cb-rg" aria-label="Banyak bagian"></label><b class="cb-n">4</b>
  <button type="button" class="alt sm cb-uq">Potong tidak sama besar</button><button type="button" class="alt sm cb-clr">Hapus arsiran</button></div>
  <div class="cb-fig"><svg viewBox="0 0 640 100" class="cb-svg"></svg></div><div class="cb-res" aria-live="polite"></div><p class="sub cb-hint">Ketuk bagian pita untuk mengarsir.</p>`;
 const svg=el.querySelector('svg'),res=el.querySelector('.cb-res'),rg=el.querySelector('.cb-rg'),ub=el.querySelector('.cb-uq');
 const mk=()=>{w=uq&&n>1?unequal(n):Array(n).fill(1);[...sh].forEach(i=>{if(i>=n)sh.delete(i)})};
 const text=()=>uq&&n>1?'Bagian-bagiannya tidak sama besar, jadi bagian yang diarsir belum bisa ditulis sebagai pecahan.':`${sh.size} bagian diarsir dari ${n} bagian sama besar.`;
 const draw=()=>{const tot=w.reduce((a,b)=>a+b,0),X=20,W=600;let x=X,o='';
  w.forEach((v,i)=>{const pw=v/tot*W;o+=`<rect data-i="${i}" x="${x}" y="10" width="${pw}" height="80" fill="${sh.has(i)?A_SH:'#fff'}" stroke="${A_IN}" stroke-width="3" class="cb-pc${fresh?' cb-in':''}"/>`;x+=pw});
  svg.innerHTML=o;fresh=false;
  res.innerHTML=uq&&n>1?`<div class="cb-out">${fbig('?','?','#c0353a')}<span>${text()}</span></div>`:`<div class="cb-out">${fbig(sh.size,n)}<span>${sh.size} bagian diarsir<br>dari ${n} bagian sama besar</span></div>`;
  ub.textContent=uq?'Potong sama besar':'Potong tidak sama besar';ub.disabled=n<2};
 rg.oninput=()=>{n=+rg.value;el.querySelector('.cb-n').textContent=n;fresh=true;mk();draw()};
 rg.onchange=()=>
 ub.onclick=()=>{uq=!uq;fresh=true;mk();draw();};
 el.querySelector('.cb-clr').onclick=()=>{sh.clear();draw()};
 svg.onclick=e=>{let i=e.target.dataset.i;if(i==null)return;i=+i;sh.has(i)?sh.delete(i):sh.add(i);draw();};
 draw()}

/* 2. membandingkan pecahan satuan */
function cobaBanding(el){let a=4,b=5,stop=null;
 el.innerHTML=`<div class="cb-ctl"><span class="cb-fr"><b>1</b><i></i><select class="cb-a" aria-label="Penyebut pecahan pertama">${optN(4,2,10)}</select></span><span class="cb-dan">dan</span>
  <span class="cb-fr"><b>1</b><i></i><select class="cb-b" aria-label="Penyebut pecahan kedua">${optN(5,2,10)}</select></span><button type="button" class="cb-go">▶ Potong &amp; bandingkan</button></div>
  <div class="cb-fig"><svg viewBox="0 0 640 220" class="cb-svg"></svg></div><div class="cb-res" aria-live="polite"></div>`;
 const svg=el.querySelector('svg'),res=el.querySelector('.cb-res'),C1=A_SH,C2='#f5a524';
 const draw=t=>{const X=30,W=500,H=56,Y=[30,130];let o='';
  [[a,C1],[b,C2]].forEach(([d,c],r)=>{const y=Y[r],pw=W/d,cut=cl(t/.35*2-r),shd=sub(t,.35,.55);
   o+=`<rect x="${X}" y="${y}" width="${W}" height="${H}" fill="#fff"/><rect x="${X}" y="${y}" width="${pw}" height="${H}" fill="${c}" opacity="${shd}"/><rect x="${X}" y="${y}" width="${W}" height="${H}" fill="none" stroke="${A_IN}" stroke-width="3"/>`;
   for(let j=1;j<d;j++)if(cut>0)o+=`<line x1="${X+j*pw}" x2="${X+j*pw}" y1="${y}" y2="${y+H*cut}" stroke="${A_IN}" stroke-width="2.5"/>`;
   o+=frS(590,y+H/2-12,1,d,22,c==='#f5a524'?'#c77d00':'#2b7bc0',shd)});
  const g=sub(t,.55,.8);if(g>0)[[a,C1],[b,C2]].forEach(([d,c])=>{o+=`<line x1="${X+W/d}" x2="${X+W/d}" y1="${20}" y2="${20+(190)*g}" stroke="${c}" stroke-width="3" stroke-dasharray="8 6"/>`});
  svg.innerHTML=o};
 const result=()=>{const s=a<b?'&gt;':a>b?'&lt;':'=',why=a===b?'penyebutnya sama, jadi potongannya sama besar':a<b?'penyebut lebih kecil → potongan lebih besar':'penyebut lebih besar → potongan lebih kecil';
  res.innerHTML=`<div class="cb-out">${fbig(1,a)}<span class="cb-sym">${s}</span>${fbig(1,b)}<span>${why}</span></div>`;};
 el.querySelector('.cb-go').onclick=()=>{a=+el.querySelector('.cb-a').value;b=+el.querySelector('.cb-b').value;res.innerHTML='';stop&&stop();stop=tween(2600,u=>draw(u),result)};
 el.querySelectorAll('select').forEach(s=>s.onchange=()=>{a=+el.querySelector('.cb-a').value;b=+el.querySelector('.cb-b').value;res.innerHTML='';draw(0)});
 draw(0)}

/* 3. melompat dengan pecahan satuan */
function cobaLompat(el){let d=7,A=3,B=5,stop=null;
 el.innerHTML=`<div class="cb-ctl"><label class="cb-l">Penyebut <select class="cb-d">${optN(7,2,10)}</select></label>
  <label class="cb-l">Pecahan A: pembilang <input type="number" class="cb-num cb-A" value="3" min="0" max="7" inputmode="numeric"></label>
  <label class="cb-l">Pecahan B: pembilang <input type="number" class="cb-num cb-B" value="5" min="0" max="7" inputmode="numeric"></label><button type="button" class="cb-go">▶ Lompat</button></div>
  <div class="cb-fig"><svg viewBox="0 0 640 250" class="cb-svg"></svg></div><div class="cb-res" aria-live="polite"></div>`;
 const svg=el.querySelector('svg'),res=el.querySelector('.cb-res'),C=[A_SH,'#f5a524'];
 const draw=hp=>{const X=40,L=560,Ys=[100,215];let o='';
  [[A,'A'],[B,'B']].forEach(([m,nm],r)=>{const Y=Ys[r],st=L/d;
   o+=`<line x1="${X}" x2="${X+L}" y1="${Y}" y2="${Y}" stroke="${A_IN}" stroke-width="3"/>`+txS(X-24,Y+6,nm,18,C[r]==='#f5a524'?'#c77d00':'#2b7bc0',1,'middle',800);
   for(let i=0;i<=d;i++){o+=`<line x1="${X+i*st}" x2="${X+i*st}" y1="${Y-9}" y2="${Y+9}" stroke="${A_IN}" stroke-width="2.5"/>`;o+=txS(X+i*st,Y+30,i===0?'0':i===d?'1':`${i}/${d}`,14,'#3a3e4a',1,'middle',600)}
   const p=Math.min(hp,m),full=Math.floor(p+1e-6),fr=p-full;
   for(let j=0;j<full;j++)o+=`<path d="M${X+j*st} ${Y}Q${X+(j+.5)*st} ${Y-56} ${X+(j+1)*st} ${Y}" fill="none" stroke="${C[r]}" stroke-width="3"/>`;
   if(fr>0){const x=X+(full+fr)*st,y=Y-Math.sin(Math.PI*fr)*42;o+=`<circle cx="${x}" cy="${y}" r="9" fill="${C[r]}" stroke="#fff" stroke-width="2"/>`}
   else o+=`<circle cx="${X+p*st}" cy="${Y}" r="9" fill="${C[r]}" stroke="#fff" stroke-width="2"/>`});
  svg.innerHTML=o};
 const result=()=>{const s=A<B?'&lt;':A>B?'&gt;':'=',why=A===B?'banyak langkahnya sama, ukuran langkahnya sama':A<B?'langkah B lebih banyak, ukuran langkahnya sama':'langkah A lebih banyak, ukuran langkahnya sama';
  res.innerHTML=`<div class="cb-out">${fbig(A,d,'#2b7bc0')}<span class="cb-sym">${s}</span>${fbig(B,d,'#c77d00')}<span>${why}</span></div>`;};
 const read=()=>{d=+el.querySelector('.cb-d').value;const fix=c=>{const i=el.querySelector(c);let v=Math.round(+i.value||0);v=cl(v,0,d);i.value=v;i.max=d;return v};A=fix('.cb-A');B=fix('.cb-B')};
 el.querySelector('.cb-go').onclick=()=>{read();res.innerHTML='';stop&&stop();const hops=Math.max(A,B,1);stop=tween(hops*520,u=>draw(u*hops),result)};
 el.querySelector('.cb-d').onchange=()=>{read();res.innerHTML='';draw(0)};
 draw(0)}

/* 4. memotong ulang menjadi pecahan senilai */
function cobaPotong(el){let a=1,b=2,m=1,stop=null;const AW=[[1,2],[1,3],[2,3],[3,4],[2,5]];
 el.innerHTML=`<div class="cb-ctl"><span class="cb-l">Pecahan awal:</span>${AW.map(([x,y],i)=>`<button type="button" class="cb-chip${i===0?' on':''}" data-f="${x}/${y}">${x}/${y}</button>`).join('')}
  <span class="cb-l" style="margin-left:6px">Potong setiap bagian menjadi:</span>${[2,3,4].map(v=>`<button type="button" class="cb-m" data-m="${v}">${v}</button>`).join('')}<button type="button" class="alt sm cb-rs" title="Kembali ke pecahan awal">↺</button></div>
  <div class="cb-fig"><svg viewBox="0 0 640 210" class="cb-svg"></svg></div><div class="cb-res" aria-live="polite"></div>`;
 const svg=el.querySelector('svg'),res=el.querySelector('.cb-res');
 const draw=(t,pm)=>{const X=40,W=560,Y=14,H=70,Y2=120,H2=50,nb=b*m,ob=b*(pm||1);let o='';
  o+=`<rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="#fff"/><rect x="${X}" y="${Y}" width="${W*a/b}" height="${H}" fill="${A_SH}"/>`;
  for(let j=1;j<nb;j++){const old=(j*ob)%nb===0;const f=old?1:t;if(f>0)o+=`<line x1="${X+j*W/nb}" x2="${X+j*W/nb}" y1="${Y}" y2="${Y+H*f}" stroke="${f<1?'#e5484d':A_IN}" stroke-width="${old&&j%m===0?3:2.2}" ${f<1?'stroke-dasharray="6 4"':''}/>`}
  o+=`<rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="none" stroke="${A_IN}" stroke-width="3"/>`;
  o+=`<rect x="${X}" y="${Y2}" width="${W}" height="${H2}" fill="#fff"/><rect x="${X}" y="${Y2}" width="${W*a/b}" height="${H2}" fill="#a9d4f5"/>`;
  for(let j=1;j<b;j++)o+=`<line x1="${X+j*W/b}" x2="${X+j*W/b}" y1="${Y2}" y2="${Y2+H2}" stroke="${A_IN}" stroke-width="2.5"/>`;
  o+=`<rect x="${X}" y="${Y2}" width="${W}" height="${H2}" fill="none" stroke="${A_IN}" stroke-width="3"/>`;
  o+=`<line x1="${X+W*a/b}" x2="${X+W*a/b}" y1="${Y-8}" y2="${Y2+H2+8}" stroke="#d92d20" stroke-width="2.5" stroke-dasharray="6 5"/>`;
  o+=txS(X,Y2+H2+26,`Pita awal ${a}/${b} (acuan)`,15,'#5d6170',1,'start',500);svg.innerHTML=o};
 const out=()=>{res.innerHTML=m===1?`<div class="cb-out">${fbig(a,b)}</div>`:`<div class="cb-out"><span class="cb-eqw">${fbig(a,b)}<span class="cb-x top">×${m}</span><span class="cb-x bot">×${m}</span></span><span class="cb-sym">=</span>${fbig(a*m,b*m,'#2b7bc0')}<span>Arsirannya tetap sama panjang dengan pita acuan.</span></div>`};
 el.querySelectorAll('.cb-chip').forEach(c=>c.onclick=()=>{[a,b]=c.dataset.f.split('/').map(Number);m=1;el.querySelectorAll('.cb-chip').forEach(x=>x.classList.toggle('on',x===c));stop&&stop();draw(1);out()});
 el.querySelectorAll('.cb-m').forEach(c=>c.onclick=()=>{const pm=m;m=+c.dataset.m;el.querySelectorAll('.cb-m').forEach(x=>x.classList.toggle('on',x===c));stop&&stop();res.innerHTML='';
  stop=tween(900,u=>draw(ez(u),pm),()=>{out();})});
 el.querySelector('.cb-rs').onclick=()=>{m=1;el.querySelectorAll('.cb-m').forEach(x=>x.classList.remove('on'));stop&&stop();draw(1);out()};
 draw(1);out()}

function alatCoba(){const w=document.querySelector('#app > .wrap');if(!w)return;const d=document.createElement('div');
 d.innerHTML=`<div class="an-head" style="margin-top:30px"><div><h3 style="font-size:22px">Animasi coba sendiri</h3><p class="sub" style="margin:2px 0 0">Empat alat yang sama dengan yang ada di setiap pertemuan.</p></div></div>`+Object.entries(COBA).map(([k,[t]],i)=>`<div class="an-sec"><span class="an-tag">Animasi ${i+1}</span><div><h3>${t}</h3></div></div><div class="box coba fs-alat" data-c="${k}"></div>`).join('');
 w.appendChild(d);d.querySelectorAll('[data-c]').forEach(x=>COBA[x.dataset.c][1](x))}
const COBA={p1:['Membagi sama besar',cobaBagi],p2:['Membandingkan pecahan satuan',cobaBanding],p3:['Melompat dengan pecahan satuan',cobaLompat],p4:['Memotong ulang menjadi pecahan senilai',cobaPotong]};

/* ================= TANTANGAN (game) ================= */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
function gShell(el,G){let r=0,sk=0,qs=G.make(),ans=false;
 const draw=()=>{if(r>=qs.length){const bt=sk>=qs.length?3:sk>=qs.length-1?2:sk>=Math.ceil(qs.length/2)?1:0;
   el.innerHTML=`<div class="gm-head"><div><div class="kick">Tantangan</div><h3>${G.judul}</h3></div></div><div class="gm-end"><div class="gm-stars">${[0,1,2].map(i=>`<span class="${i<bt?'on':''}">★</span>`).join('')}</div><div class="gm-big">Skor ${sk} dari ${qs.length}</div><p class="sub">${bt===3?'Semua benar.':bt>=2?'Hampir semua benar.':'Coba sekali lagi, perhatikan gambarnya.'}</p><button type="button" class="gm-again">Main lagi</button></div>`;
   el.querySelector('.gm-again').onclick=()=>{r=0;sk=0;qs=G.make();draw()};return}
  ans=false;const q=qs[r];
  el.innerHTML=`<div class="gm-head"><div><div class="kick">Tantangan</div><h3>${G.judul}</h3></div><div class="gm-pr">${qs.map((_,i)=>`<i class="${i<r?'d':i===r?'c':''}"></i>`).join('')}<span>Skor ${sk}</span></div></div>
   <div class="gm-q">${G.ask(q)}</div><div class="gm-body">${G.view(q)}</div><div class="gm-fb" aria-live="polite"></div><div class="gm-nx"></div>`;
  G.bind(el,q,(ok,msg)=>{if(ans)return;ans=true;if(ok){sk++;}else 
   el.querySelector('.gm-fb').innerHTML=`<div class="gm-msg ${ok?'g-ok':'g-no'}"><b>${ok?'Benar.':'Belum tepat.'}</b> ${msg}</div>`;
   el.querySelector('.gm-pr span').textContent='Skor '+sk;
   el.querySelector('.gm-nx').innerHTML=`<button type="button">${r<qs.length-1?'Soal berikutnya →':'Lihat skor'}</button>`;
   el.querySelector('.gm-nx button').onclick=()=>{r++;draw()}})};
 draw()}
/* gambar batang/lingkaran bebas ukuran bagian */
function gBar(ws,shade=[],o={}){const W=o.w||300,H=o.h||56;let x=4,s='';const tot=ws.reduce((a,b)=>a+b,0);
 ws.forEach((w,i)=>{const pw=w/tot*(W-8);s+=`<rect x="${x}" y="4" width="${pw}" height="${H}" fill="${shade.includes(i)?A_SH:'#fff'}" stroke="${A_IN}" stroke-width="2.5"/>`;x+=pw});
 return `<svg viewBox="0 0 ${W} ${H+8}" width="${W}" style="max-width:100%">${s}</svg>`}
function gCirc(ws,shade=[],o={}){const R=o.r||64,c=R+4;let a=-Math.PI/2,s='';const tot=ws.reduce((x,y)=>x+y,0);
 ws.forEach((w,i)=>{const b=a+w/tot*2*Math.PI,lg=b-a>Math.PI?1:0;s+=`<path d="M${c} ${c}L${c+R*Math.cos(a)} ${c+R*Math.sin(a)}A${R} ${R} 0 ${lg} 1 ${c+R*Math.cos(b)} ${c+R*Math.sin(b)}Z" fill="${shade.includes(i)?A_SH:'#fff'}" stroke="${A_IN}" stroke-width="2.5" stroke-linejoin="round"/>`;a=b});
 return `<svg viewBox="0 0 ${2*c} ${2*c}" width="${2*c}">${s}</svg>`}
function unequal(n){let w;do{w=Array.from({length:n},()=>rnd(5,20))}while(Math.max(...w)/Math.min(...w)<1.8);return w}

const GAME={
p1:{judul:'Sama besar atau tidak?',
 make(){const eq=[true,false,true,false,Math.random()<.5].sort(()=>Math.random()-.5);return eq.map(e=>{const n=rnd(2,6);return{n,e,t:pick(['bar','circ']),w:e?Array(n).fill(1):unequal(n)}})},
 ask:q=>`Apakah bangun ini dibagi menjadi <b>${q.n} bagian yang sama besar</b>?`,
 view:q=>`<div class="gm-fig">${q.t==='bar'?gBar(q.w,[0],{w:340}):gCirc(q.w,[0])}</div><div class="gm-opts"><button type="button" class="gm-o" data-v="1">Ya, sama besar</button><button type="button" class="gm-o" data-v="0">Tidak sama besar</button></div>`,
 bind(el,q,done){el.querySelectorAll('.gm-o').forEach(b=>b.onclick=()=>{const ok=(b.dataset.v==='1')===q.e;b.classList.add(ok?'g-ok':'g-no');el.querySelectorAll('.gm-o').forEach(x=>x.disabled=true);
  done(ok,q.e?`Bagiannya sama besar, jadi bagian yang diarsir adalah 1/${q.n}.`:`Bagiannya tidak sama besar, jadi bagian yang diarsir <b>bukan</b> 1/${q.n}.`)})}},
p2:{judul:'Mana yang lebih besar?',
 make(){const out=[];while(out.length<5){const a=rnd(2,10),b=rnd(2,10);if(a!==b&&!out.some(q=>q.a===a&&q.b===b))out.push({a,b})}return out},
 ask:()=>`Ketuk pecahan yang <b>lebih besar</b>.`,
 view:q=>`<div class="gm-pair">${[q.a,q.b].map((d,i)=>`<button type="button" class="gm-card" data-d="${d}"><span class="gm-fr"><b>1</b><i></i><b>${d}</b></span><span class="gm-rev">${gBar(Array(d).fill(1),[0],{w:220,h:34})}</span></button>`).join('')}</div>`,
 bind(el,q,done){el.querySelectorAll('.gm-card').forEach(b=>b.onclick=()=>{const d=+b.dataset.d,big=Math.min(q.a,q.b),ok=d===big;
  el.querySelectorAll('.gm-card').forEach(x=>{x.disabled=true;x.classList.add('rev');if(+x.dataset.d===big)x.classList.add('g-ok')});if(!ok)b.classList.add('g-no');
  done(ok,`Cokelat yang dibagi ${big} bagiannya lebih besar daripada yang dibagi ${Math.max(q.a,q.b)}. Jadi 1/${big} &gt; 1/${Math.max(q.a,q.b)}.`)})}},
p3:{judul:'Lompat ke sasaran',
 make(){const out=[];while(out.length<5){const b=pick([4,5,6,8]),a=rnd(1,b);if(!out.some(q=>q.a===a&&q.b===b))out.push({a,b})}return out},
 ask:q=>`Bantu Si Bulat melompat ke <span class="gm-inl">${q.a}/${q.b}</span>. Setiap lompatan 1/${q.b}.`,
 view:q=>`<div class="gm-line"><svg viewBox="0 0 640 170" class="gm-nl"></svg></div><div class="gm-opts"><button type="button" class="alt" data-j="-1">◀ Mundur</button><button type="button" data-j="1">Lompat 1/${q.b} ▶</button><button type="button" class="gm-stop">Berhenti di sini</button></div>`,
 bind(el,q,done){const svg=el.querySelector('.gm-nl'),X=50,L=540,Y=120,st=L/q.b;let pos=0,anim=0,fin=false;
  const paint=(p,showT)=>{let o=`<line x1="${X-14}" x2="${X+L+14}" y1="${Y}" y2="${Y}" stroke="${A_IN}" stroke-width="3" stroke-linecap="round"/>`;
   for(let i=0;i<=q.b;i++){o+=`<line x1="${X+i*st}" x2="${X+i*st}" y1="${Y-9}" y2="${Y+9}" stroke="${A_IN}" stroke-width="${i%q.b?2.5:3.5}"/>`;o+=i===0?txS(X,Y+34,'0',18):i===q.b?txS(X+L,Y+34,'1',18):''}
   for(let j=0;j<Math.floor(p+1e-6);j++)o+=`<path d="M${X+j*st} ${Y-4}Q${X+(j+.5)*st} ${Y-70} ${X+(j+1)*st} ${Y-4}" fill="none" stroke="#5b5bf0" stroke-width="2" stroke-dasharray="5 5"/>`;
   if(showT)o+=`<g transform="translate(${X+q.a*st} ${Y})"><line y1="0" y2="-50" stroke="#22a06b" stroke-width="3"/><path d="M0 -50h24l-6 8 6 8H0z" fill="#22a06b"/></g>`+frS(X+q.a*st,Y+30,q.a,q.b,15,'#22a06b');
   const fr=p-Math.floor(p);o+=bulat(X+p*st,Y-18-Math.sin(Math.PI*fr)*55,15);
   o+=txS(600,30,`${Math.round(p)} lompatan`,16,'#5d6170',1,'end',600);svg.innerHTML=o};
  paint(0,false);
  el.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{if(fin||anim)return;const d=+b.dataset.j,to=cl(pos+d,0,q.b);if(to===pos)return;const from=pos,t0=performance.now();
   const f=t=>{const u=cl((t-t0)/420);paint(from+(to-from)*ez(u),false);if(u<1)anim=requestAnimationFrame(f);else{anim=0;pos=to;}};anim=requestAnimationFrame(f)});
  el.querySelector('.gm-stop').onclick=()=>{if(fin||anim)return;fin=true;el.querySelectorAll('.gm-opts button').forEach(x=>x.disabled=true);paint(pos,true);
   done(pos===q.a,pos===q.a?`${q.a} lompatan 1/${q.b} sampai di ${q.a}/${q.b}.`:`Si Bulat berhenti di ${pos}/${q.b}. Untuk sampai di ${q.a}/${q.b} perlu ${q.a} lompatan (lihat bendera hijau).`)}}},
p4:{judul:'Potong ulang',
 make(){const base=[[1,2],[1,3],[2,3],[1,4],[3,4],[2,5],[1,6],[3,5]].sort(()=>Math.random()-.5);const out=[];
  for(const [a,b] of base){const ms=[2,3,4].filter(m=>b*m<=12);if(!ms.length)continue;out.push({a,b,m:pick(ms)});if(out.length===5)break}return out},
 ask:q=>`Ubah <span class="gm-inl">${q.a}/${q.b}</span> menjadi pecahan berpenyebut <b>${q.b*q.m}</b>. Setiap bagian dipotong menjadi berapa?`,

function orang(o,mood=''){const [,,k,h,g,b]=o;const jilbab=g==='jilbab';

 else if(g==='ikat')hair=`<circle cx="40" cy="12" r="7" fill="${h}"/><path d="M18 38 Q18 14 40 15 Q62 14 62 38 Q56 24 40 25 Q24 24 18 38Z" fill="${h}"/>`;
 else if(g==='keriting')hair=[[24,24],[32,17],[42,15],[52,18],[58,26],[20,32],[60,33]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="8" fill="${h}"/>`).join('');

/* ubi nuabosi: irisan ubi (kulit cokelat, daging krem) */
function manggulu(ws,o={}){const W=o.w||420,H=o.h||64,gap=(o.gap!=null?o.gap:6),tot=ws.reduce((a,b)=>a+b,0),avail=W-gap*(ws.length-1)-8;let x=4,s='';
 ws.forEach((w,i)=>{const pw=w/tot*avail,on=o.sel&&o.sel.has(i),y=on?0:10;
  s+=`<g data-i="${i}" class="${o.tap?'tk-tap':''}"><rect x="${x}" y="${y}" width="${pw}" height="${H}" rx="${Math.min(10,pw/3)}" fill="${on?'#ffe08a':'#f4e6c4'}" stroke="${on?'#e0a100':'#8a5a2e'}" stroke-width="${on?5:4}"/>`;
  s+=`<path d="M${x+pw*.5} ${y+H*.22} v${H*.56}" stroke="#e6cf9c" stroke-width="2.5" stroke-linecap="round"/>`;
  if(pw>30)s+=`<path d="M${x+pw*.28} ${y+H*.35} q${pw*.08} ${H*.15} 0 ${H*.3}M${x+pw*.72} ${y+H*.35} q${-pw*.08} ${H*.15} 0 ${H*.3}" fill="none" stroke="#e9d6a8" stroke-width="2"/>`;
  s+=`</g>`;x+=pw+gap});
 return `<svg viewBox="0 0 ${W} ${H+14}" class="tk-svg" style="max-width:${W}px">${s}</svg>`}
/* kue alu ndene: bulat seperti pizza, dilihat dari atas */
function bolu(n,o={}){const R=o.r||110,c=R+16;let s=`<circle cx="${c}" cy="${c+4}" r="${R+10}" fill="#e7e2da"/>`,a=-Math.PI/2;const ws=o.ws||Array(n).fill(1),tot=ws.reduce((x,y)=>x+y,0);
 ws.forEach((w,i)=>{const b=a+w/tot*2*Math.PI,m=(a+b)/2,on=o.sel&&o.sel.has(i),dx=on?Math.cos(m)*12:0,dy=on?Math.sin(m)*12:0,lg=b-a>Math.PI?1:0;
  const p=`M${c} ${c}L${c+R*Math.cos(a)} ${c+R*Math.sin(a)}A${R} ${R} 0 ${lg} 1 ${c+R*Math.cos(b)} ${c+R*Math.sin(b)}Z`;
  s+=`<g data-i="${i}" class="${o.tap?'tk-tap':''}" transform="translate(${dx} ${dy})"><path d="${p}" fill="${on?'#ffe08a':'#f6ead0'}" stroke="${on?'#e0a100':'#b98545'}" stroke-width="${on?4:2.5}" stroke-linejoin="round"/>`;
  s+=`<path d="M${c+(R-8)*Math.cos(a+.04)} ${c+(R-8)*Math.sin(a+.04)}A${R-8} ${R-8} 0 ${lg} 1 ${c+(R-8)*Math.cos(b-.04)} ${c+(R-8)*Math.sin(b-.04)}" fill="none" stroke="#c98f4a" stroke-width="8" stroke-linecap="round" opacity=".75"/>`;
  [[.42,-.12],[.62,.1],[.5,.22]].forEach(([rr,da])=>{const ang=m+da*(b-a);s+=`<circle cx="${c+R*rr*Math.cos(ang)}" cy="${c+R*rr*Math.sin(ang)}" r="${R/40+1.5}" fill="#d9b77e"/>`});s+=`</g>`;a=b});
 return `<svg viewBox="0 0 ${2*c} ${2*c+8}" class="tk-svg" style="max-width:${2*c}px">${s}</svg>`}

let CEL_AC=null;
function celBunyi(){try{CEL_AC=CEL_AC||new (window.AudioContext||window.webkitAudioContext)();const a=CEL_AC;if(a.state==='suspended')a.resume();
 const t0=a.currentTime+.02;[[523.25,0],[659.25,.09],[783.99,.18],[1046.5,.27]].forEach(([f,d],i)=>{const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;
  const t=t0+d,len=i===3?.45:.16;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+len+.02)})}catch(e){}}

 const t0=a.currentTime+.02;[[392,0],[311.13,.16]].forEach(([f,d],i)=>{const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t0+d);o.frequency.exponentialRampToValueAtTime(f*.85,t0+d+.22);
  const t=t0+d,len=i?.32:.18;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+len+.02)})}catch(e){}}

 celBunyi();

 const t0=performance.now();const f=t=>{const k=(t-t0)/1600;c.clearRect(0,0,innerWidth,innerHeight);
  P.forEach(p=>{p.vy+=.32;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;c.save();c.globalAlpha=Math.max(0,1-k*k);c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;
   if(p.round){c.beginPath();c.arc(0,0,p.w/2.4,0,7);c.fill()}else c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()});
  if(k<1)requestAnimationFrame(f);else cv.remove()};requestAnimationFrame(f)}

/* ================= halaman pertemuan ================= */
function pertemuan(p){
 const secs=secList(p),idx=P.indexOf(p);
 const kartuNav=`<div class="ps-pick">${Object.entries(p.sets).map(([k,s])=>`<div class="ps-card"><b>${Object.keys(p.sets).length>1?s.nama.split(' · ')[0]:'Kartu berlabel'}</b><small>${s.pairs.length} pasang · ${s.pairs.length*2} kartu</small><div class="ps-btns"><button type="button" class="ps-open" data-set="${k}" data-mode="pasang">▶ Berpasangan</button><button type="button" class="ps-open alt" data-set="${k}" data-mode="semua">▦ Semua kartu</button></div></div>`).join('')}</div>`;
 const body={
  dugaan:`<div class="fs-bar">${fsBtn('dugaan')}</div>`+p.dugaan.map((d,i)=>`<div class="dq-box fs-go" data-fs="dugaan" data-i="${i}" title="Tayangkan layar penuh"><span class="dq-no">Pertanyaan ${i+1}</span><div class="dq-q">${d.q}</div></div>`).join(''),
  kartu:kartuNav+`<p class="sub" style="margin:18px 0 8px">Pratinjau kartu (klik pasangan kartu untuk menayangkannya):</p>`+Object.entries(p.sets).map(([k,s])=>`<div id="${k}" class="box" style="margin-bottom:12px"><b>${s.nama}</b><div class="sub" style="margin-bottom:12px">${s.ket}</div>
   <div class="pairs">${s.pairs.map((pr,pi)=>`<div class="pair ps-pv" data-set="${k}" data-k="${pi}" title="Tayangkan layar penuh">${kartuW(pr[0],'Contoh')}${kartuW(pr[1],'Bukan Contoh')}</div>`).join('')}</div></div>`).join(''),
  tebak:`<div class="fs-bar">${fsBtn('tebak')}</div><div id="tebakwrap" class="fs-src"><div class="seg"><button id="mode1">Mode biasa</button><button id="mode2">Mode duel (2 siswa)</button></div>
   <div class="sub modehint" id="modehint"></div>
   <div class="box"><div class="sub" style="margin-bottom:8px">${p.tebak.nama}</div><div class="tebak" id="tbk"></div><div id="duel" style="display:none"></div></div></div>`,
  lkpd:`<div class="lk-top"><div class="seg lk-mode"><button type="button" data-lm="latihan" class="on">Latihan mandiri</button><button type="button" data-lm="duel">Duel 2 tim</button></div>${fsBtn('lkpd')}</div><div class="lk-latihan">`+p.lkpd.map((s,i)=>`<div class="box" style="margin-bottom:12px" id="lk${i}"><b>${i+1}. ${s.judul}</b><div class="lkb"></div></div>`).join('')+`</div><div class="lk-duel" hidden><div class="box" id="dlk"></div></div>`,
  animasi:`<div class="fs-bar">${fsBtn('animasi')}</div><div class="an-sec"><span class="an-tag">Bagian 1</span><div><h3>Animasi penjelasan</h3><p class="sub">Gambar bergerak menjelaskan setiap langkah.</p></div></div><div class="box anim" id="anim"></div>
   <div class="an-sec"><span class="an-tag">Bagian 2</span><div><h3>Coba sendiri: ${COBA[p.id]?COBA[p.id][0].toLowerCase():''}</h3><p class="sub">Ubah angka atau ketuk tombol, lalu amati perubahannya bersama peserta didik.</p></div></div><div class="box coba" id="coba"></div>
   <div class="an-sec"><span class="an-tag">Bagian 3</span><div><h3>Tantangan</h3><p class="sub">5 soal, peserta didik maju bergiliran.</p></div></div><div class="box gm" id="tantangan"></div>`,
  pengali:`<div class="box" id="pgl"></div>`,
  maju:`<div class="fs-bar">${fsBtn('maju')}</div><div class="box" id="mj"></div>`};
 const nextP=P[idx+1];
 const panels=secs.map((s,i)=>{const g=GRP[s.g],pv=secs[i-1],nx=secs[i+1];
  return `<section class="panel" id="sec-${s.id}" hidden>
  <div class="ph"><span class="bnum">${i+1}</span><div style="flex:1"><h2>${s.t}</h2><div class="sub">${g[0]} · ${s.w}</div></div>${TOURS[s.id]?`<button type="button" class="alt sm t2-again" data-tour="${s.id}">? Panduan</button>`:''}</div>
  ${guideHTML(s.guide)}
  ${body[s.id]}
  <div class="pager">${pv?`<a href="#${p.id}-${pv.id}"><small>Sebelumnya</small><b>${pv.t}</b></a>`:'<span></span>'}${nx?`<a class="nx" href="#${p.id}-${nx.id}"><small>Selanjutnya</small><b>${nx.t}</b></a>`:nextP?`<a class="nx" href="#${nextP.id}"><small>Pertemuan berikutnya</small><b>${nextP.judul}</b></a>`:`<a class="nx" href="#beranda"><small>Selesai</small><b>Kembali ke beranda</b></a>`}</div></section>`}).join('');
 const side=GRP.map((g,gi)=>!secs.some(s=>s.g===gi)?'':`<div class="sg"><h6>${g[0]}</h6>${secs.map((s,i)=>[s,i]).filter(([s])=>s.g===gi).map(([s,i])=>`<a class="si" data-s="${s.id}" href="#${p.id}-${s.id}"><span class="ic" style="--c:${g[1]}">${i+1}</span><span class="tx"><b>${s.t}</b><small>${s.w}</small></span></a>`).join('')}</div>`).join('');
 return `<section class="hero sm"><div class="wrap hgrid sm"><div>

 <div class="wrap shell" id="shell"><nav class="side">${side}</nav><div class="content">${panels}</div></div>`;

function kartuW(c,label,big){
 let fig,fr='';
 if(c.cmp){const[a,b,op]=c.cmp;fig=`<div class="kbars">${bar(a[1],a[0],{w:220,h:40})}${bar(b[1],b[0],{w:220,h:40})}</div>`;fr=`<div class="kfr sm">${F(...a)} ${op==='!='?'≠':op} ${F(...b)}</div>`}
 else if(c.txt)fig=`<div class="ktxt">${c.txt}</div>`;
 else{fig=`<div class="${c.f.t==='bar'?'kbar1':'kshape'}">${shape(c.f,{w:220,h:48,r:60,size:110})}</div>`;fr=`<div class="kfr">${fx(c.l)}</div>`}
 return `<div class="kc${big?' big':''}"><div class="kin">${fig}${fr}</div><div class="klab">${label}</div></div>`}

 const app=document.getElementById('app');
 tebakInit(p);

 majuInit(p);

function tebakInit(p){
 const el=document.getElementById('tbk');let order=p.tebak.cards.map((_,i)=>i),k=0,vote=null,shown=false,score={c:0,n:0};
 function draw(){const c=p.tebak.cards[order[k]];
  el.innerHTML=`<div class="tb-top"><span>Kartu ${k+1} dari ${order.length}</span><span class="tb-skor">Skor kelas <b>${score.c}</b> dari ${score.n}</span></div>
  <div class="tb-card${shown?' dicap':''}">${kartuW(c,'Kartu '+(p.id==='p1'?'U':'T')+(order[k]+1),true)}${shown?`<span class="tb-cap ${vote===c.c?'cap-ok':'cap-no'}">${vote===c.c?'BENAR':'SALAH'}</span>`:''}</div>
  <div class="tb-btns"><button type="button" class="tb-b tb-ya${shown&&vote===true?' dipilih':''}" data-v="1" ${shown?'disabled':''}>✔ Contoh</button><button type="button" class="tb-b tb-tidak${shown&&vote===false?' dipilih':''}" data-v="0" ${shown?'disabled':''}>✘ Bukan contoh</button></div>
  ${shown?`<div class="note" style="max-width:420px">Pembahasan: ${fx(c.r)}</div>`:''}
  <div class="row" style="justify-content:center"><button class="alt sm" id="tp" ${k===0?'disabled':''}>← Sebelumnya</button><button class="alt sm" id="tsh">🔀 Acak</button><button class="sm" id="tn2" ${k===order.length-1?'disabled':''}>Berikutnya →</button></div>`;
  el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{vote=b.dataset.v==='1';shown=true;score.n++;if(vote===c.c){score.c++;try{celBunyi()}catch(e){}}else{try{salahBunyi()}catch(e){}}draw()});
  el.querySelector('#tp').onclick=()=>{k--;shown=false;draw()};el.querySelector('#tn2').onclick=()=>{k++;shown=false;draw()};
  el.querySelector('#tsh').onclick=()=>{order.sort(()=>Math.random()-.5);k=0;shown=false;score={c:0,n:0};draw()};}
 draw();
}

/* ================= MODE DUEL KARTU TEBAK ================= */
let DUELKEY=null;
function duelInit(p){
 const b1=document.getElementById('mode1'),b2=document.getElementById('mode2'),tb=document.getElementById('tbk'),du=document.getElementById('duel');
 if(DUELKEY){document.removeEventListener('keydown',DUELKEY);DUELKEY=null}
 const pre=p.id==='p1'?'U':'T';let hist=[],hasil=false,order=p.tebak.cards.map((_,i)=>i),k=0,sc=[0,0],nama=['Pemain 1','Pemain 2'],out=new Set(),done=false,msg='',aktif=false;
 const setMode=d=>{aktif=d;tb.style.display=d?'none':'grid';du.style.display=d?'block':'none';b1.classList.toggle('on',!d);b2.classList.toggle('on',d);const mh=document.getElementById('modehint');if(mh)mh.innerHTML=d?'Keyboard: pemain kiri A = Contoh, S = Bukan Contoh; pemain kanan K = Contoh, L = Bukan Contoh.':'';if(d)draw()};
 b1.onclick=()=>setMode(false);b2.onclick=()=>setMode(true);
 function jawab(pl,v){if(done||out.has(pl))return;const c=p.tebak.cards[order[k]];
  if(v===c.c){sc[pl]++;done=true;hist[k]=pl;celebrate({el:document.getElementById('duel'),side:pl,teks:nama[pl]+' benar!'});msg=`<span style="color:var(--ok)">🏆 ${nama[pl]} lebih dulu menjawab benar! +1</span>`;}
  else{out.add(pl);salahBunyi();hist[k]=-1;
   if(out.size===2){done=true;msg='<span style="color:var(--bad)">Keduanya belum tepat.</span>'}
   else msg=`<span style="color:var(--bad)">${nama[pl]} belum tepat. Giliran ${nama[1-pl]}!</span>`}
  draw()}
 function panel(pl){const keys=pl===0?['A','S']:['K','L'];const off=done||out.has(pl);
  return `<div class="dp ${out.has(pl)?'out':''}"><input maxlength="24" aria-label="Nama" class="dn" data-p="${pl}" value="${nama[pl]}"><div class="ds">${sc[pl]}</div>
   <button class="db dok" data-p="${pl}" data-v="1" ${off?'disabled':''}>✔ Contoh<small>tombol ${keys[0]}</small></button>
   <button class="db dno" data-p="${pl}" data-v="0" ${off?'disabled':''}>✘ Bukan Contoh<small>tombol ${keys[1]}</small></button></div>`}
 const papan=()=>`<div class="sb-board sb2"><div class="sb2-p kr${sc[0]>sc[1]?' lead':''}"><b>${nama[0]}</b><em>${sc[0]}</em></div><span class="sb2-vs">:</span><div class="sb2-p kn${sc[1]>sc[0]?' lead':''}"><em>${sc[1]}</em><b>${nama[1]}</b></div></div>`;
 function akhirHTML(){const w=sc[0]===sc[1]?-1:sc[0]>sc[1]?0:1;
  return `${papan()}<div class="sb-end">${w<0?`<div class="sb-trophy">🤝</div><h3>Seri!</h3><p>${nama[0]} dan ${nama[1]} sama-sama mendapat <b>${sc[0]}</b> poin.</p>`:`<div class="sb-trophy">🏆</div><h3>${nama[w]} menang!</h3><p><b>${sc[w]}</b> poin lawan <b>${sc[1-w]}</b> poin.</p>`}
   <div class="sb-tbl">${order.map((o,i)=>`<span><small>Kartu ${pre}${o+1}</small><b class="${hist[i]===0?'kr':hist[i]===1?'kn':'x'}">${hist[i]===0?nama[0]:hist[i]===1?nama[1]:'—'}</b></span>`).join('')}</div>
   <div class="row" style="justify-content:center;margin-top:14px"><button id="dr">↺ Main lagi (acak)</button></div></div>`}
 function draw(){if(hasil){du.innerHTML=akhirHTML();du.querySelector('#dr').onclick=()=>{order.sort(()=>Math.random()-.5);k=0;sc=[0,0];hist=[];hasil=false;out.clear();done=false;msg='';draw()};return}
  const c=p.tebak.cards[order[k]],akhir=k===order.length-1&&done;
  du.innerHTML=`${papan()}<div class="sub" style="text-align:center">Kartu ${k+1} dari ${order.length} · siapa cepat dan benar, dapat 1 poin</div>
  <div class="dg">${panel(0)}<div class="dc tb-card${done?' dicap':''}">${kartuW(c,'Kartu '+pre+(order[k]+1),true)}${done?`<span class="tb-cap ${hist[k]>=0?'cap-ok':'cap-no'}">${hist[k]>=0?'BENAR':'SALAH'}</span>`:''}</div>${panel(1)}</div>
  <div class="verdict" style="font-size:19px">${msg}</div>
  ${done?`<div class="note" style="max-width:520px;margin:6px auto">Pembahasan: ${fx(c.r)}</div>`:''}
  <div class="row" style="justify-content:center;margin-top:8px"><button class="alt sm" id="dr">↺ Main lagi (acak)</button>${!akhir?`<button class="sm" id="dnx" ${done?'':'disabled'}>Kartu berikutnya →</button>`:`<button class="sm" id="dend">🏆 Lihat hasil akhir</button>`}</div>`;
  const de=du.querySelector('#dend');if(de)de.onclick=()=>{hasil=true;draw();if(sc[0]!==sc[1])celebrate({el:du.querySelector('.sb-end'),teks:'Juara: '+nama[sc[0]>sc[1]?0:1]})};
  du.querySelectorAll('.db').forEach(x=>x.onclick=()=>jawab(+x.dataset.p,x.dataset.v==='1'));
  du.querySelectorAll('.dn').forEach(x=>x.onchange=()=>{nama[+x.dataset.p]=bersih(x.value)||('Pemain '+(+x.dataset.p+1));const b=du.querySelector('.sb-board');if(b)b.outerHTML=papan()});
  const nx=du.querySelector('#dnx');if(nx)nx.onclick=()=>{k++;out.clear();done=false;msg='';draw()};
  du.querySelector('#dr').onclick=()=>{order.sort(()=>Math.random()-.5);k=0;sc=[0,0];hist=[];hasil=false;out.clear();done=false;msg='';draw()}}
 DUELKEY=e=>{if(!aktif||e.target.tagName==='INPUT'||!du.offsetParent)return;const m={a:[0,true],s:[0,false],k:[1,true],l:[1,false]}[e.key.toLowerCase()];if(m){e.preventDefault();jawab(m[0],m[1])}};
 document.addEventListener('keydown',DUELKEY);
 setMode(false);
}

/* ================= LATIHAN PENGALI SENILAI (P4) ================= */
const PGL=[
 {op:'×',a:[1,3],k:2,cari:null},
 {op:'×',a:[2,5],k:3,cari:'b'},{op:'×',a:[3,4],k:4,cari:'a'},{op:'×',a:[1,6],k:4,cari:'a'},
 {op:'×',a:[4,7],k:3,cari:'b'},{op:'×',a:[5,8],k:5,cari:'a'},
 {op:':',a:[6,9],k:3,cari:null},
 {op:':',a:[8,12],k:4,cari:'a'},{op:':',a:[10,15],k:5,cari:'b'},{op:':',a:[9,12],k:3,cari:'b'}];
function pengaliInit(){
 const el=document.getElementById('pgl');if(!el)return;
 const hasil=q=>q.op==='×'?[q.a[0]*q.k,q.a[1]*q.k]:[q.a[0]/q.k,q.a[1]/q.k];
 const kartu=(q,i)=>{const h=hasil(q),ex=q.cari===null,inp=(cls,v)=>ex?`<b class="pv">${v}</b>`:`<input class="fin pin ${cls}" inputmode="numeric">`;
  const atas=q.cari==='a'?inp('ra',''):`<b class="pv">${h[0]}</b>`,bawah=q.cari==='b'?inp('rb',''):`<b class="pv">${h[1]}</b>`;
  return `<div class="pq" data-i="${i}"><div class="pno">${i+1}.${ex?' <span class="sub">(contoh)</span>':''}</div>
   <div class="pk"><svg viewBox="0 0 200 150" class="parc"><path d="M55 40 Q100 -5 145 40" fill="none" stroke="#7aa2c8" stroke-width="2.5" marker-end="url(#ah)"/><path d="M55 110 Q100 155 145 110" fill="none" stroke="#7aa2c8" stroke-width="2.5" marker-end="url(#ah)"/>
   <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#7aa2c8"/></marker></defs></svg>
   <div class="pop top">${q.op}${ex?`<b class="pv">${q.k}</b>`:`<input class="fin pin k1" inputmode="numeric">`}</div>
   <div class="pop bot">${q.op}${ex?`<b class="pv">${q.k}</b>`:`<input class="fin pin k2" inputmode="numeric">`}</div>
   <div class="pf l">${F(...q.a)}</div><div class="peq">=</div>
   <div class="pf r"><span class="fstack">${atas}<hr>${bawah}</span></div></div>
   ${ex?'':`<button class="sm alt">Cek</button>`}<div class="res"></div><div class="pbar"></div></div>`};
 el.innerHTML=`<div class="sub">Dipakai setelah aturan pecahan senilai ditemukan dari kartu. <b>Bagian A</b> (nomor 1–6, kalikan) untuk semua siswa. <b>Bagian B</b> (nomor 7–10, bagi) pengayaan. Isi kotak pengali/pembagi di atas dan bawah, lalu lengkapi pecahannya. Nomor 1 dan 7 adalah contoh.</div><div class="pgrid">${PGL.map(kartu).join('')}</div>`;
 el.querySelectorAll('.pq').forEach(box=>{const q=PGL[+box.dataset.i],h=hasil(q),bt=box.querySelector('button');
  const showBar=()=>{box.querySelector('.pbar').innerHTML=bar(q.a[1],q.a[0],{w:200,h:20})+bar(h[1],h[0],{w:200,h:20})};
  if(!bt){showBar();return}
  bt.onclick=()=>{const v=c=>{const x=box.querySelector('.'+c);return x?+x.value:null},k1=v('k1'),k2=v('k2'),r=q.cari==='a'?v('ra'):v('rb'),want=q.cari==='a'?h[0]:h[1],res=box.querySelector('.res');
   ['k1','k2'].forEach(c=>{const x=box.querySelector('.'+c);x.className='fin pin '+c+(+x.value===q.k?' ok':' bad')});
   const ri=box.querySelector(q.cari==='a'?'.ra':'.rb');ri.className='fin pin '+(q.cari==='a'?'ra':'rb')+(r===want?' ok':' bad');
   if(k1!==k2){res.textContent='Pengali atas dan bawah harus sama!';res.className='res bad';return}
   const ok=k1===q.k&&r===want;res.textContent=ok?'✔ Benar':'✘ Coba lagi';res.className='res '+(ok?'ok':'bad');if(ok)showBar()}});
}

/* ================= DUEL LKPD (15 ronde × 2 soal, khusus interaktif) ================= */
function mkDL(){
 const shp=d=>d[0]==='b'?B(d[1],d[2]):d[0]==='c'?C(d[1],d[2]):d[0]==='g'?Q(grid(d[1],d[2]),d[3]):d[0]==='ub'?B(d[1],d[2]):d[0]==='uc'?C(d[1],d[2]):null;
 const nOf=d=>d[0]==='g'?[d[3],d[1]*d[2]]:[d[2],d[1]];
 const isi=d=>({t:'isi',q:'Tuliskan pecahan yang ditunjukkan gambar.',f:shp(d),a:nOf(d)});
 const yn=(d,lab,benar)=>({t:'pilih',q:'Apakah gambar ini menunjukkan '+fx(lab)+'?',f:shp(d),o:['Ya','Tidak'],a:benar?0:1});
 const cmp=(x,y)=>{const u=x[0]/x[1],v=y[0]/y[1];return Math.abs(u-v)<1e-9?'=':u>v?'>':'<'};
 const bd=(x,y)=>({t:'banding',x,y,a:cmp(x,y)});
 const ext=(arr,besar)=>{const v=arr.map(f=>f[0]/f[1]);const i=v.indexOf(besar?Math.max(...v):Math.min(...v));return {t:'pilih',q:'Pecahan yang paling '+(besar?'besar':'kecil')+' adalah …',o:arr.map(f=>f[0]+'/'+f[1]),a:i}};
 const lk=(x,k)=>k>0?{t:'lengkapi',x,n:x[1]*k,a:x[0]*k}:{t:'lengkapi',x,n:x[1]/-k,a:x[0]/-k};
 const sn=(x,y)=>({t:'pilih',q:'Benarkah '+F(...x)+' = '+F(...y)+'?',o:['Benar','Salah'],a:cmp(x,y)==='='?0:1});
 const P1=[
  [isi(['b',5,2]),isi(['b',6,4])],[isi(['c',8,3]),isi(['c',6,5])],[isi(['g',2,2,1]),isi(['g',2,3,5])],
  [yn(['b',4,1],'1/4',true),yn(['ub',[1,2,1,1],1],'1/4',false)],
