   cek=()=>pick.length===it._ans.length&&pick.every((f,i)=>f===it._ans[i])}
  const v=el.querySelector('#mjv');
  el.querySelector('#mjc').onclick=()=>{const ok=cek();if(ok)celebrate({el:el.querySelector('#mjv').closest('.box')||el});else salahBunyi();if(!(order[k] in dijawab)){dijawab[order[k]]=ok;if(ok)skor++}
   v.innerHTML=ok?'<span style="color:var(--ok)">✔ Benar! Hebat.</span>':'<span style="color:var(--bad)">✘ Belum tepat. Coba lagi, atau minta bantuan teman.</span>';
   el.querySelector('.sub b').textContent=skor;el.querySelector('.sub').innerHTML=`Benar: <b>${skor}</b> dari ${Object.keys(dijawab).length} soal dijawab`};
  el.querySelector('#mjk').onclick=()=>{v.innerHTML=`<span style="color:var(--navy)">Jawaban: ${kunci}</span>${it.e?`<div class="note" style="max-width:520px;margin:6px auto 0;font-weight:500">Pembahasan: ${fx(it.e)}</div>`:''}`};
  el.querySelector('#mjp').onclick=()=>{k--;draw()};el.querySelector('#mjn').onclick=()=>{k++;draw()};
  el.querySelector('#mja').onclick=()=>{order.sort(()=>Math.random()-.5);k=0;skor=0;dijawab={};draw()};
 }
 draw();
}

/* ================= LKPD ================= */
function res(el,ok){el.textContent=ok?'✔ Benar':'✘ Coba lagi';el.className='res '+(ok?'ok':'bad')}
function fin(v=''){return `<input class="fin" inputmode="numeric" value="${v}">`}
function fstack(){return `<span class="fstack">${fin()}<hr>${fin()}</span>`}
const LK={
 baca(el,s){el.innerHTML=s.items.map((it,i)=>`<div class="item row" data-i="${i}">${shape(it.f)}${fstack()}<button class="sm alt">Cek</button><span class="res"></span></div>`).join('');
  el.querySelectorAll('.item').forEach(row=>{const it=s.items[+row.dataset.i],ins=row.querySelectorAll('input');row.querySelector('button').onclick=()=>{let ok=true;ins.forEach((x,j)=>{const g=+x.value===it.a[j];x.className='fin '+(g?'ok':'bad');ok=ok&&g});res(row.querySelector('.res'),ok)}})},
 banding(el,s){el.innerHTML=s.items.map((it,i)=>`<div class="item" data-i="${i}"><div class="pairfig"><div style="text-align:center">${shape(it.fa)}<br>${fstack()}</div>
   ${it.op==='='?'<span class="big"><b>=</b></span>':`<select class="sel"><option value="">?</option><option>&lt;</option><option>&gt;</option><option>=</option></select>`}
   <div style="text-align:center">${shape(it.fb)}<br>${fstack()}</div><button class="sm alt">Cek</button><span class="res"></span></div></div>`).join('');
  el.querySelectorAll('.item').forEach(row=>{const it=s.items[+row.dataset.i],ins=row.querySelectorAll('input'),sel=row.querySelector('select');
   row.querySelector('button').onclick=()=>{let ok=true;ins.forEach((x,j)=>{const g=+x.value===it.a[j];x.className='fin '+(g?'ok':'bad');ok=ok&&g});
    if(sel){const g=sel.value===it.op;sel.className='sel '+(g?'ok':'bad');ok=ok&&g}res(row.querySelector('.res'),ok)}})},
 warnai(el,s){el.innerHTML=`<div class="sub">Ketuk bagian gambar untuk mewarnai.</div><div class="row" style="gap:24px;align-items:flex-end">${s.items.map((it,i)=>`<div class="item" data-i="${i}" style="border:0;text-align:center"><div class="fig"></div><div class="big">${fx(it.l)}</div><button class="sm alt">Cek</button><div class="res"></div></div>`).join('')}</div>`;
  el.querySelectorAll('.item').forEach(row=>{const it=s.items[+row.dataset.i],on=new Set(),fig=row.querySelector('.fig');
   const draw=()=>{fig.innerHTML=shape({...it.f,s:[...on]},{tap:true});fig.querySelectorAll('.tap').forEach(t=>t.onclick=()=>{const j=+t.dataset.i;on.has(j)?on.delete(j):on.add(j);draw()})};draw();
   row.querySelector('button').onclick=()=>res(row.querySelector('.res'),on.size===it.n)})},
 urut(el,s){const it=s.items[0];const val=f=>{const[a,b]=f.split('/');return a/b};const ans=[...it.fr].sort((a,b)=>val(a)-val(b));let pick=[];
  const draw=()=>{el.innerHTML=`<div class="sub">Ketuk pecahan sesuai urutan.</div><div class="row" style="margin:8px 0">${it.fr.map(f=>`<button class="chipf ${pick.includes(f)?'used':''}" data-f="${f}">${fx(f)}</button>`).join('')}</div>
   <div class="row">${ans.map((_,i)=>`<span class="slot">${pick[i]?fx(pick[i]):''}</span>${i<ans.length-1?'<b>&lt;</b>':''}`).join('')}</div>
   <div class="row" style="margin-top:8px"><button class="alt sm" id="ur">↺ Ulang</button><button class="sm alt" id="uc">Cek</button><span class="res"></span></div>`;
   el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{if(!pick.includes(b.dataset.f)){pick.push(b.dataset.f);draw()}});
   el.querySelector('#ur').onclick=()=>{pick=[];draw()};
   el.querySelector('#uc').onclick=()=>res(el.querySelector('.res'),pick.length===ans.length&&pick.every((f,i)=>f===ans[i]))};draw()},
 lengkapi(el,s){el.innerHTML=`<div class="row" style="gap:22px">${s.items.map((it,i)=>`<div class="item" data-i="${i}" style="border:0;text-align:center">${bar(it.a[1],it.a[0],{w:150,h:24})}<br>${bar(it.b,0,{w:150,h:24,tap:true})}
   <div class="big" style="margin-top:6px">${F(...it.a)} = <span class="fstack">${fin()}<hr><b>${it.b}</b></span></div><button class="sm alt">Cek</button><div class="res"></div></div>`).join('')}</div><div class="sub">Tip: warnai batang bawah sampai luasnya sama dengan batang atas.</div>`;
  el.querySelectorAll('.item').forEach(row=>{const it=s.items[+row.dataset.i],svg=row.querySelectorAll('svg')[1],on=new Set();
   const bind=()=>svg.querySelectorAll('.tap').forEach(t=>t.onclick=()=>{const j=+t.dataset.i;on.has(j)?on.delete(j):on.add(j);t.setAttribute('fill',on.has(j)?SH:'#fff')});bind();
   row.querySelector('button').onclick=()=>{const x=row.querySelector('input'),g=+x.value===it.x;x.className='fin '+(g?'ok':'bad');res(row.querySelector('.res'),g)}})},
 pasang(el,s){const it=s.items[0];let sel=null,done={};const kn=[...it.kanan];
  const draw=()=>{el.innerHTML=`<div class="sub">Ketuk satu pecahan di kiri, lalu pasangannya di kanan.</div><div style="display:grid;grid-template-columns:auto auto;gap:8px 40px;justify-content:start;margin-top:8px">
   ${it.kiri.map((l,i)=>`<button class="chipf ${sel===l?'pick':''} ${done[l]?'used':''}" data-l="${l}">${fx(l)}${done[l]?' → '+fx(done[l]):''}</button><button class="chipf ${Object.values(done).includes(kn[i])?'used':''}" data-r="${kn[i]}">${fx(kn[i])}</button>`).join('')}</div>
   <div class="row" style="margin-top:8px"><button class="alt sm" id="pr">↺ Ulang</button><button class="sm alt" id="pc">Cek</button><span class="res"></span></div>`;
   el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{sel=b.dataset.l;draw()});
   el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(!sel)return;for(const k in done)if(done[k]===b.dataset.r)delete done[k];done[sel]=b.dataset.r;sel=null;draw()});
   el.querySelector('#pr').onclick=()=>{done={};sel=null;draw()};
   el.querySelector('#pc').onclick=()=>{const n=it.kiri.filter(l=>done[l]===it.ans[l]).length;const r=el.querySelector('.res');r.textContent=n===4?'✔ Semua benar':`${n} dari 4 benar`;r.className='res '+(n===4?'ok':'bad')}};draw()}
};

/* ================= alat peraga ================= */
function alat(){return `<section class="hero sm"><div class="wrap"><div class="crumb"><a href="#beranda">Beranda</a> / Semua pertemuan</div><h1>Alat Peraga Digital</h1><p style="margin:0">Membandingkan dua pecahan pada batang yang panjang keseluruhannya sama.</p></div></section>
 <div class="wrap" style="padding-top:22px;padding-bottom:140px;max-width:820px"><div class="fs-bar">${fsBtn('alat','Tayangkan layar penuh')}</div><div class="guide"><span class="gt">Petunjuk</span><p>Atur penyebut dan pembilang Pecahan A dan B dengan penggeser. Tanda perbandingannya muncul di kotak kuning. Bentuk batang bisa diganti lingkaran.</p></div><div class="box fs-alat">${[0,1].map(i=>`<div style="margin-bottom:16px"><div class="row"><b style="width:90px">Pecahan ${'AB'[i]}</b><span class="big" id="af${i}"></span></div>
 <label class="sub">Penyebut <b id="ab${i}"></b></label><input type="range" min="1" max="16" value="${i?8:4}" id="rb${i}">
 <label class="sub">Pembilang <b id="aa${i}"></b></label><input type="range" min="0" max="16" value="${i?2:1}" id="ra${i}">
 <div id="ag${i}" style="margin-top:6px"></div></div>`).join('')}
 <div class="rumus" id="acmp" style="font-size:22px"></div>
 <div class="row" style="margin-top:10px"><button class="alt sm" id="atog">Ganti ke lingkaran</button></div></div></div>`}
function bindAlat(){let mode='bar';
 const upd=()=>{const v=[0,1].map(i=>{const rb=document.getElementById('rb'+i),ra=document.getElementById('ra'+i);ra.max=rb.value;if(+ra.value>+rb.value)ra.value=rb.value;return[+ra.value,+rb.value]});
  v.forEach(([a,b],i)=>{document.getElementById('aa'+i).textContent=a;document.getElementById('ab'+i).textContent=b;document.getElementById('af'+i).innerHTML=F(a,b);
   document.getElementById('ag'+i).innerHTML=mode==='bar'?bar(b,a,{w:Math.min(560,document.querySelector('main').clientWidth-60),h:40}):circ(b,a,{r:70})});
  const x=v[0][0]/v[0][1],y=v[1][0]/v[1][1];document.getElementById('acmp').innerHTML=`${F(...v[0])} ${Math.abs(x-y)<1e-9?'=':x>y?'&gt;':'&lt;'} ${F(...v[1])}`};
 document.querySelectorAll('input[type=range]').forEach(r=>r.oninput=upd);
 document.getElementById('atog').onclick=e=>{mode=mode==='bar'?'circ':'bar';e.target.textContent=mode==='bar'?'Ganti ke lingkaran':'Ganti ke batang';upd()};upd()}

window.addEventListener('hashchange',()=>{ROUTE=location.hash||'#beranda';if(ROUTE!==LAST)render()});
/* pindah halaman tanpa bergantung pada link #: penampil artifact bisa menahan klik link */
window.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;const h=a.getAttribute('href');if(!h||h.length<2)return;e.preventDefault();navTo(h)},true);
render();
</script>
